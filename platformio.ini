; platformio.ini — PlatformIO Project Configuration
;
; This file tells PlatformIO:
;   - What board you're using (Arduino Uno)
;   - What serial speed to use for the Serial Monitor
;   - Which external libraries to automatically download and install

[env:uno]
platform  = atmelavr
board     = uno
framework = arduino

; Baud rate for the Serial Monitor (must match Serial.begin() in your code)
monitor_speed = 9600

; PlatformIO will automatically download these libraries from its registry.
; Adafruit GFX is the core graphics engine.
; Adafruit SSD1306 is the specific OLED driver built on top of GFX.
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
